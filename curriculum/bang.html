<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>金榜 · 角色榜大屏｜取经计划</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;}
:root{
  --ink:#1f1a12; --ink-soft:#4a3f2c;
  --zhu:#a62828;
}
body{
  font-family:"KaiTi","STKaiti","BiauKai",serif;
  /* 明黄哑光绫纸：旧化渐变 + 斑驳 */
  background:
    radial-gradient(900px 480px at 26% 6%, rgba(255,252,240,.9), transparent 65%),
    radial-gradient(820px 420px at 76% 96%, rgba(210,190,150,.35), transparent 70%),
    linear-gradient(115deg,#faf6ea 0%,#f6efdd 45%,#f2e9d2 100%);
  color:var(--ink);
}
/* 纸面暗角（自然边缘） */
body::after{content:"";position:fixed;inset:0;pointer-events:none;
  box-shadow:inset 0 0 90px rgba(90,62,12,.30), inset 0 0 18px rgba(90,62,12,.14);}

.stage{position:fixed;inset:0;display:flex;flex-direction:column;padding:26px 34px 20px;}

/* 顶部小字 */
.top{flex:0 0 auto;text-align:center;font-size:12px;letter-spacing:.42em;color:#6b5424;margin-bottom:4px;}
.top b{color:#8a6400;font-weight:700;}

/* ===== 三栏 ===== */
.cols{flex:1;display:flex;align-items:stretch;min-height:0;padding:10px 0;}

/* 名单栏：竖排名录，列间等距 */
.namelist{flex:1;display:flex;justify-content:center;align-items:center;gap:30px;min-width:0;}
.nmcol{display:flex;flex-direction:column;align-items:center;gap:12px;cursor:pointer;padding:6px 2px;border-radius:6px;transition:background .15s;}
.nmcol:hover{background:rgba(255,250,225,.55);}
.nmcol .rk{writing-mode:vertical-rl;text-orientation:upright;font-size:12px;letter-spacing:5px;color:#6b5424;line-height:1;
  border-left:1px solid rgba(120,88,20,.35);border-right:1px solid rgba(120,88,20,.35);padding:4px 0;}
.nmcol .nm{writing-mode:vertical-rl;text-orientation:upright;font-size:30px;font-weight:900;letter-spacing:9px;color:var(--ink);line-height:1;}
.nmcol .ro{writing-mode:vertical-rl;text-orientation:upright;font-size:12.5px;letter-spacing:4px;color:var(--ink-soft);line-height:1;}

/* 中栏：榜 */
.mid{flex:0 0 296px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  background:#22231d;border-radius:30px;padding:26px 0;box-shadow:0 16px 40px rgba(20,20,14,.35), inset 0 0 0 1px rgba(240,226,186,.14);}
.mid .logo{width:104px;height:104px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.4));}
.mid .bang{font-size:236px;font-weight:900;line-height:.92;color:#eee0b8;letter-spacing:0;text-shadow:0 2px 10px rgba(0,0,0,.35);}
.mid .qr{width:126px;height:126px;background:#fff;padding:6px;border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.35);}

/* 朱红方印（点缀，原图直接放置） */

/* 底部 */
.foot{flex:0 0 auto;text-align:center;font-size:11.5px;letter-spacing:.3em;color:#6b5424;padding-top:2px;}
.foot b{color:#8a6400;}

/* ===== 单人详情 ===== */
.detail{position:fixed;inset:0;display:none;z-index:60;background:rgba(60,34,6,.45);}
.detail.show{display:flex;align-items:center;justify-content:center;}
.d-board{width:80%;height:82%;background:
    radial-gradient(600px 300px at 30% 0%, rgba(255,248,210,.6), transparent 60%),
    linear-gradient(102deg,#f2dc9c,#f8e8bc 40%,#eed592 70%,#f4e2ab);
  border:2px solid rgba(150,110,30,.55);border-radius:10px;
  box-shadow:0 20px 55px rgba(40,20,0,.5), inset 0 0 60px rgba(120,86,20,.12);
  position:relative;display:flex;padding:32px 50px;gap:42px;align-items:center;}
.d-left{flex:0 0 250px;display:flex;flex-direction:column;align-items:center;gap:14px;}
.d-face{width:148px;height:148px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:78px;color:#fff;
  box-shadow:0 10px 26px rgba(40,30,10,.3), inset 0 0 0 4px rgba(255,255,255,.4);}
.d-nm{font-size:44px;font-weight:900;letter-spacing:10px;color:var(--ink);}
.d-rank{font-size:13px;font-weight:800;color:#fdf2d8;background:var(--zhu);padding:4px 18px;border-radius:4px;letter-spacing:.22em;}
.d-body{flex:1;min-width:0;}
.d-body .pt{font-size:26px;font-weight:900;color:#5e4300;letter-spacing:3px;}
.d-body .sb{font-size:13.5px;color:var(--ink-soft);margin-top:5px;letter-spacing:1px;}
.d-body .desc{margin-top:14px;font-size:15px;line-height:2;text-align:justify;color:#332a1c;}
.d-body .desc b{color:var(--zhu);}
.d-rows{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px;}
.d-row{background:rgba(255,252,232,.7);border:1px solid rgba(150,110,30,.4);border-radius:8px;padding:11px 15px;}
.d-row h4{font-size:12.5px;color:#6e4a10;letter-spacing:.2em;margin-bottom:5px;font-weight:800;}
.d-row h4 em{font-style:normal;color:var(--zhu);margin-right:5px;}
.d-row p{font-size:13px;line-height:1.85;color:#3a3223;}
.d-row p b{color:var(--zhu);}
.d-back{position:absolute;left:20px;top:16px;cursor:pointer;z-index:9;
  font-size:13.5px;font-weight:800;letter-spacing:.08em;color:#fdf2d8;background:var(--zhu);
  border-radius:6px;padding:7px 16px;box-shadow:0 3px 10px rgba(90,20,10,.3);}
.d-back:hover{background:#8c1f1f;}
.d-foot{position:absolute;bottom:12px;left:0;right:0;text-align:center;font-size:11.5px;letter-spacing:.25em;color:var(--ink-soft);}
</style>
</head>
<body>

<div class="stage">
  <div class="top">取经计划 · 项目管理训练营 <b>·</b> 丙午年 春月 吉日</div>

  <div class="cols">

    <!-- 左栏：一甲 -->
    <div class="namelist">
      <div class="nmcol" onclick="openRole(0)">
        <span class="rk">第一甲第一名</span>
        <span class="nm">觀音</span>
        <span class="ro">取經項目辦·PMO總監</span>
      </div>
      <div class="nmcol" onclick="openRole(1)">
        <span class="rk">第一甲第二名</span>
        <span class="nm">唐僧</span>
        <span class="ro">項目經理·掌舵人</span>
      </div>
      <div class="nmcol" onclick="openRole(2)">
        <span class="rk">第一甲第三名</span>
        <span class="nm">孫悟空</span>
        <span class="ro">技術總監·技術擔當</span>
      </div>
    </div>

    <!-- 中栏：榜 + logo + 自测码 -->
    <div class="mid">
      <img class="logo" src="seal/logo-qj.svg" alt="取经计划">
      <div class="bang">榜</div>
      <img class="qr" src="images-qr-test.svg" alt="扫码自测">
    </div>

    <!-- 右栏：二甲 -->
    <div class="namelist">
      <div class="nmcol" onclick="openRole(3)">
        <span class="rk">第二甲第一名</span>
        <span class="nm">豬八戒</span>
        <span class="ro">商務協調·協調擔當</span>
      </div>
      <div class="nmcol" onclick="openRole(4)">
        <span class="rk">第二甲第二名</span>
        <span class="nm">沙僧</span>
        <span class="ro">項目助理·執行擔當</span>
      </div>
      <div class="nmcol" onclick="openRole(5)">
        <span class="rk">第二甲第三名</span>
        <span class="nm">白龍馬</span>
        <span class="ro">支撑保障·後勤擔當</span>
      </div>
    </div>

  </div>

  <div class="foot">點擊任一姓名 <b>·</b> 展開單人金榜</div>
</div>

<!-- ===== 单人详情 ===== -->
<div class="detail" id="detailView">
  <div class="d-board">
    <div class="d-back" onclick="backWall()">‹ 返回金榜</div>
    <div class="d-left">
      <div class="d-face" id="dFace"></div>
      <div class="d-nm" id="dNm"></div>
      <div class="d-rank" id="dRank"></div>
    </div>
    <div class="d-body">
      <div class="pt" id="dPt"></div>
      <div class="sb" id="dSb"></div>
      <div class="desc" id="dDesc"></div>
      <div class="d-rows">
        <div class="d-row"><h4><em>◈</em>你的天赋</h4><p id="dGood"></p></div>
        <div class="d-row"><h4><em>◈</em>要防的坑</h4><p id="dAdvice"></p></div>
      </div>
    </div>
    <div class="d-foot" id="dFoot"></div>
  </div>
</div>

<script>
var ROLES = [
  {key:"gy", rank:"特设 · 取经项目办", ico:"🎐", color:"#8a6400",
   nm:"观音", pt:"PMO 总监 · 项目治理者", sb:"治理统御型 · 不出场打妖，却决定项目成败",
   desc:"你像观音：不替悟空打妖、不替唐僧念经，却让十四年取经路一路闭环。<b>你的价值不在\"亲自干\"，而在让所有人的\"干\"成为体系</b>——立项领命、点将授权、制度红线、里程碑督导、验收发证，一环不缺。能人解决一场战斗，你保证每个项目都打得赢。",
   good:"治理与体系化：把能人组织成体系，把偶然的胜利变成可复制的成功。",
   advice:"治理者最大的坑是<b>'管得过界'</b>。记住观音的'不是'：不顶替项目经理决策、不替一线干具体活——该管的管到，不该管的别碰。",
   foot:"番外 · PMO 总监课 · 观音令"},
  {key:"ts", rank:"一甲 · 执掌方向", ico:"🧘", color:"#8f5bbf",
   nm:"唐僧", pt:"项目经理 · 掌舵人", sb:"目标坚定型 · 天生定方向的人",
   desc:"你像唐僧：不打妖怪，但决定往哪打。你的价值在于<b>目标坚定、守住底线、扛起最终责任</b>——团队迷茫时，你是那个说'我们到底为什么而战'的人。你未必是团队里最能干的，但你是最不可替代的。",
   good:"愿景与定力：面对诱惑（女儿国式变更）和压力，你比谁都稳。",
   advice:"掌舵人最大的坑是<b>'只对上负责'</b>。多听一手信息，别让权威代替倾听——三打白骨精上的误判，是你的前车之鉴。",
   foot:"L+ 通识全景课 · 唐僧印"},
  {key:"wk", rank:"一甲 · 攻坚克难", ico:"🐒", color:"#e65c00",
   nm:"孙悟空", pt:"技术总监 · 技术担当", sb:"攻坚力量型 · 硬仗全靠你",
   desc:"你像悟空：能力越强，责任越大。团队里最难的活、最险的局，都习惯性想到你。<b>出事第一个上，没事第一个挨骂</b>——这是骨干的宿命，也是骨干的荣耀。",
   good:"破局能力：技术天花板+救场王，你的存在让团队敢接硬仗。",
   advice:"能人最大的坑是<b>'独'</b>。让能力被看见的同时让人信得过——别让一手证据输给二手小作文，把证据讲成故事。",
   foot:"L3 实战篇 · 悟空印"},
  {key:"bj", rank:"二甲 · 协调四方", ico:"🐷", color:"#3d9bd1",
   nm:"猪八戒", pt:"商务协调 · 协调担当", sb:"沟通活泼型 · 团队的润滑剂",
   desc:"你像八戒：看着懒散，其实是团队的<b>气氛组+外交官</b>。大师兄被赶走、团队濒临散伙时，去花果山把人请回来的，是你。懂人性、会说话，是你的超能力。",
   good:"危机公关与凝聚力：能把'散伙'谈成'再扛一程'的人，全团队只有一个。",
   advice:"协调者最大的坑是<b>'只圆不产'</b>。关键时刻牵头一件事——净坛使者那一功，是'请回悟空'挣来的。",
   foot:"L4 治理篇 · 八戒印"},
  {key:"ss", rank:"二甲 · 零失误交付", ico:"🧑‍🌾", color:"#00a97f",
   nm:"沙僧", pt:"项目助理 · 执行担当", sb:"靠谱和平型 · 团队的压舱石",
   desc:"你像沙僧：话不多，但<b>答应的事件件有着落</b>。资料整理、数据核对、文档收尾——这些活不起眼，却直接决定项目最终的样子。任劳任怨、零失误交付，是你的名片。",
   good:"稳定性与责任心：把最重的担子挑得最稳，是所有团队的压舱石。",
   advice:"执行者最大的坑是<b>'靠谱但隐形'</b>。关键节点留痕、阶段性主动汇报——让'默默干完'变成'有人知道你干完了'。",
   foot:"L2 基础篇 · 沙僧印"},
  {key:"blm", rank:"二甲 · 沉默托底", ico:"🐴", color:"#b8912f",
   nm:"白龙马", pt:"支撑保障 · 后勤担当", sb:"沉默支撑型 · 项目的驮行者",
   desc:"你像白龙马：不出声、不抢戏，<b>驮着整个项目跑完全程</b>。环境和工具链是否就绪、流程有没有漏洞、备份做没做——这些没人注意的事，你全都放在心上。你一停摆，全团瘫痪——只是他们平时没意识到。",
   good:"系统性思维与托底能力：你是最早发现流程隐患的人，也是最后离开现场的人。",
   advice:"支撑者最大的坑是<b>'被习惯'</b>。定期让关键干系人知道系统健康度（周报一页即可），别等出事才被想起。",
   foot:"L1 认知篇 · 白龙马印"}
];

function openRole(i){
  var r = ROLES[i];
  document.getElementById('dFace').style.background = r.color;
  document.getElementById('dFace').textContent = r.ico;
  document.getElementById('dNm').textContent = r.nm;
  document.getElementById('dRank').textContent = r.rank;
  document.getElementById('dPt').textContent = r.pt;
  document.getElementById('dSb').textContent = r.sb;
  document.getElementById('dDesc').innerHTML = r.desc;
  document.getElementById('dGood').innerHTML = r.good;
  document.getElementById('dAdvice').innerHTML = r.advice;
  document.getElementById('dFoot').textContent = r.foot + ' ｜ 取经计划 · 金榜';
  document.getElementById('detailView').classList.add('show');
}
function backWall(){
  document.getElementById('detailView').classList.remove('show');
}
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape') backWall();
});
</script>
</body>
</html>
