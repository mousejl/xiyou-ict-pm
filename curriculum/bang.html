<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>角色榜 · 大屏｜取经计划</title>
<style>
:root{
  --paper:#f7f0dd; --paper-d:#efe4c8;
  --gold:#b8912f; --gold-d:#8a6400; --gold-l:#d9b45f;
  --red:#9e2b25; --red-d:#7c1f1a;
  --ink:#1a2436; --sub:#6b6a60;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;}
body{
  font-family:"PingFang SC","Microsoft YaHei",sans-serif;
  background:
    radial-gradient(1200px 600px at 20% -10%, #fbf6e7 0%, transparent 60%),
    radial-gradient(1000px 700px at 90% 110%, #f0e3c2 0%, transparent 55%),
    linear-gradient(160deg,#f7f0dd,#f1e6c9);
  color:var(--ink);
}
/* ===== 页面外框（金榜装裱） ===== */
.frame{position:fixed;inset:14px;border:3px solid var(--gold-l);outline:1px solid var(--gold);border-radius:6px;display:flex;flex-direction:column;}
.frame::before{content:"";position:absolute;inset:6px;border:1px solid rgba(184,145,47,.55);border-radius:4px;pointer-events:none;}
.corner{position:absolute;width:34px;height:34px;border:3px solid var(--red);z-index:5;}
.corner.tl{top:-3px;left:-3px;border-right:0;border-bottom:0;border-radius:6px 0 0 0;}
.corner.tr{top:-3px;right:-3px;border-left:0;border-bottom:0;border-radius:0 6px 0 0;}
.corner.bl{bottom:-3px;left:-3px;border-right:0;border-top:0;border-radius:0 0 0 6px;}
.corner.br{bottom:-3px;right:-3px;border-left:0;border-top:0;border-radius:0 0 6px 0;}

/* ===== 顶栏 ===== */
.top{display:flex;align-items:center;justify-content:center;gap:18px;padding:16px 20px 8px;}
.top .mini{font-family:"KaiTi","STKaiti",serif;font-size:15px;letter-spacing:.4em;color:var(--gold-d);}
.top .line{flex:1;max-width:180px;height:1px;background:linear-gradient(90deg,transparent,var(--gold));}
.top .line.r{background:linear-gradient(90deg,var(--gold),transparent);}

/* ===== 主体 ===== */
.stage{flex:1;display:flex;gap:22px;padding:6px 26px 20px;min-height:0;}

/* 左列：榜字印 + logo/二维码竖条 */
.left{flex:0 0 236px;display:flex;align-items:center;justify-content:center;gap:14px;}
.bang{
  width:158px;height:158px;flex:0 0 auto;position:relative;border-radius:50%;
  background:radial-gradient(circle at 32% 28%, #c8423a, var(--red) 45%, var(--red-d) 100%);
  box-shadow:0 10px 26px rgba(126,31,26,.35), inset 0 0 0 5px rgba(255,235,180,.85), inset 0 0 0 8px var(--red-d);
  display:flex;align-items:center;justify-content:center;
}
.bang span{
  font-family:"KaiTi","STKaiti","SimSun",serif;font-weight:900;font-size:96px;color:#fdf3d7;
  text-shadow:0 3px 8px rgba(0,0,0,.35);transform:translateY(-4px);
}
.bang::after{content:"";position:absolute;inset:12px;border:2px dashed rgba(253,243,215,.5);border-radius:50%;}
.side{display:flex;flex-direction:column;align-items:center;gap:10px;min-width:104px;}
.side .cell{background:#fffdf6;border:1.5px solid var(--gold-l);border-radius:10px;padding:8px;box-shadow:0 4px 12px rgba(138,100,0,.14);text-align:center;}
.side .cell img{display:block;}
.side .cell.logo img{width:84px;height:84px;}
.side .cell.qr img{width:110px;height:110px;}
.side .cap{font-size:10.5px;letter-spacing:.18em;color:var(--sub);margin-top:4px;}
.side .cap b{display:block;color:var(--gold-d);font-size:11px;letter-spacing:.1em;}
.arrow{font-size:20px;color:var(--gold);animation:blink 1.6s infinite;}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}

/* 右区：六张榜卡 */
.wall{flex:1;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:1fr 1fr;gap:14px;min-width:0;}
.card{
  background:linear-gradient(180deg,#fffdf6,#faf4e3);
  border:1.5px solid var(--gold-l);border-radius:12px;position:relative;
  box-shadow:0 5px 16px rgba(26,36,54,.10);
  padding:34px 16px 12px;cursor:pointer;transition:transform .16s, box-shadow .16s;
  display:flex;flex-direction:column;align-items:center;text-align:center;overflow:hidden;
}
.card:hover{transform:translateY(-4px);box-shadow:0 12px 26px rgba(138,100,0,.22);}
.card .rank{
  position:absolute;top:10px;left:50%;transform:translateX(-50%);
  font-size:11px;font-weight:800;letter-spacing:.22em;color:#fdf3d7;
  background:var(--red);border-radius:4px;padding:3px 14px;white-space:nowrap;
  box-shadow:0 2px 6px rgba(126,31,26,.35);
}
.card .rank.gold{background:linear-gradient(135deg,#a3712a,#8a6400);}
.card .face{
  width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:34px;color:#fff;margin-bottom:8px;box-shadow:0 5px 14px rgba(26,36,54,.22), inset 0 0 0 3px rgba(255,255,255,.35);
}
.card .nm{font-family:"KaiTi","STKaiti",serif;font-size:24px;font-weight:900;letter-spacing:6px;color:var(--ink);}
.card .pt{font-size:14px;font-weight:800;color:var(--gold-d);margin-top:3px;letter-spacing:1px;}
.card .sb{font-size:11px;color:var(--sub);margin-top:5px;letter-spacing:.05em;}
.card .kws{display:flex;gap:6px;margin-top:auto;padding-top:8px;flex-wrap:wrap;justify-content:center;}
.card .kws i{font-style:normal;font-size:10.5px;color:var(--gold-d);border:1px solid var(--gold-l);border-radius:10px;padding:2px 9px;background:#fffbe9;}
.card .seal{font-size:10px;color:var(--sub);letter-spacing:.24em;margin-top:7px;}

/* ===== 详情（金榜卷轴） ===== */
.detail{position:fixed;inset:0;display:none;z-index:50;background:radial-gradient(900px 500px at 50% 0%, #fbf5e5, transparent 70%),linear-gradient(165deg,#f8f1de,#f0e5c7);}
.detail.show{display:flex;}
.d-frame{position:absolute;inset:14px;border:3px solid var(--gold-l);outline:1px solid var(--gold);border-radius:6px;}
.d-wrap{flex:1;display:flex;min-width:0;padding:34px 48px;align-items:center;gap:38px;}
.d-left{flex:0 0 300px;display:flex;flex-direction:column;align-items:center;gap:14px;}
.d-face{width:168px;height:168px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:88px;color:#fff;box-shadow:0 14px 34px rgba(26,36,54,.30), inset 0 0 0 6px rgba(255,255,255,.35);}
.d-nm{font-family:"KaiTi","STKaiti",serif;font-size:42px;font-weight:900;letter-spacing:10px;color:var(--ink);}
.d-rank{font-size:13px;font-weight:800;color:#fdf3d7;background:var(--red);padding:4px 22px;border-radius:6px;letter-spacing:.3em;box-shadow:0 3px 8px rgba(126,31,26,.3);}
.d-body{flex:1;min-width:0;}
.d-body .pt{font-size:24px;font-weight:900;color:var(--gold-d);letter-spacing:2px;}
.d-body .sb{font-size:14px;color:var(--sub);margin-top:4px;letter-spacing:1px;}
.d-body .desc{margin-top:18px;font-size:16.5px;line-height:2;color:#3c3a30;text-align:justify;}
.d-body .desc b{color:var(--red-d);}
.d-rows{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px;}
.d-row{background:#fffdf6;border:1.5px solid var(--gold-l);border-radius:10px;padding:12px 16px;}
.d-row h4{font-size:12.5px;color:var(--gold-d);letter-spacing:.28em;margin-bottom:6px;}
.d-row h4 em{font-style:normal;color:var(--red);margin-right:6px;}
.d-row p{font-size:13.5px;line-height:1.85;color:#43413a;}
.d-row p b{color:var(--red-d);}
.d-back{
  position:absolute;left:26px;top:24px;z-index:9;cursor:pointer;
  font-size:13px;font-weight:800;letter-spacing:.15em;color:var(--gold-d);
  background:#fffdf6;border:1.5px solid var(--gold-l);border-radius:8px;padding:8px 18px;
  box-shadow:0 3px 10px rgba(138,100,0,.16);
}
.d-back:hover{background:#fdf6e1;}
.d-foot{position:absolute;bottom:20px;left:0;right:0;text-align:center;font-size:11px;letter-spacing:.3em;color:var(--sub);}
</style>
</head>
<body>

<!-- ===== 榜墙视图 ===== -->
<div class="frame" id="wallView">
  <div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
  <div class="top">
    <div class="line"></div>
    <div class="mini">取经计划 · 项目管理四级训练营 —— 角色&nbsp;榜</div>
    <div class="line r"></div>
  </div>
  <div class="stage">
    <div class="left">
      <div class="bang"><span>榜</span></div>
      <div class="side">
        <div class="cell logo"><img src="seal/logo-qj.svg" alt="取经计划"></div>
        <div class="arrow">▾</div>
        <div class="cell qr"><img src="images-qr-test.svg" alt="角色自测"><div class="cap">扫码 · <b>测测你是取经团队里的谁</b></div></div>
      </div>
    </div>
    <div class="wall" id="wall"></div>
  </div>
</div>

<!-- ===== 单角色金榜（卷轴详情） ===== -->
<div class="detail" id="detailView">
  <div class="d-frame"></div>
  <div class="d-back" onclick="backWall()">‹ 返回榜单</div>
  <div class="d-wrap">
    <div class="d-left">
      <div class="d-face" id="dFace"></div>
      <div class="d-nm" id="dNm"></div>
      <div class="d-rank" id="dRank"></div>
    </div>
    <div class="d-body">
      <div class="pt" id="dPt"></div>
      <div class="sb" id="dSb"></div>
      <div class="desc" id="dDesc"></div>
      <div class="d-rows">
        <div class="d-row"><h4><em>◈</em>你的天赋</h4><p id="dGood"></p></div>
        <div class="d-row"><h4><em>◈</em>要防的坑</h4><p id="dAdvice"></p></div>
      </div>
    </div>
  </div>
  <div class="d-foot" id="dFoot"></div>
</div>

<script>
var ROLES = [
  {key:"gy", rank:"特设 · 取经项目办", rankGold:true, ico:"🎐", color:"#8a6400",
   nm:"观 音", pt:"PMO 总监 · 项目治理者", sb:"治理统御型 · 不出场打妖，却决定项目成败",
   kws:["立项把关","点将配资源","督导验收"], seal:"番外 · PMO 总监课 · 观音令",
   desc:"你像观音：不替悟空打妖、不替唐僧念经，却让十四年取经路一路闭环。<b>你的价值不在\"亲自干\"，而在让所有人的\"干\"成为体系</b>——立项领命、点将授权、制度红线、里程碑督导、验收发证，一环不缺。能人解决一场战斗，你保证每个项目都打得赢。",
   good:"治理与体系化：把能人组织成体系，把偶然的胜利变成可复制的成功。",
   advice:"治理者最大的坑是<b>'管得过界'</b>。记住观音的'不是'：不顶替项目经理决策、不替一线干具体活——该管的管到，不该管的别碰。"},
  {key:"ts", rank:"一甲 · 执掌方向", rankGold:false, ico:"🧘", color:"#8f5bbf",
   nm:"唐 僧", pt:"项目经理 · 掌舵人", sb:"目标坚定型 · 天生定方向的人",
   kws:["目标坚定","守住底线","扛起全责"], seal:"L+ 通识全景课 · 唐僧印",
   desc:"你像唐僧：不打妖怪，但决定往哪打。你的价值在于<b>目标坚定、守住底线、扛起最终责任</b>——团队迷茫时，你是那个说'我们到底为什么而战'的人。你未必是团队里最能干的，但你是最不可替代的。",
   good:"愿景与定力：面对诱惑（女儿国式变更）和压力，你比谁都稳。",
   advice:"掌舵人最大的坑是<b>'只对上负责'</b>。多听一手信息，别让权威代替倾听——三打白骨精上的误判，是你的前车之鉴。"},
  {key:"wk", rank:"一甲 · 攻坚克难", rankGold:false, ico:"🐒", color:"#e65c00",
   nm:"孙悟空", pt:"技术总监 · 技术担当", sb:"攻坚力量型 · 硬仗全靠你",
   kws:["技术天花板","救场王","敢接硬仗"], seal:"L3 实战篇 · 悟空印",
   desc:"你像悟空：能力越强，责任越大。团队里最难的活、最险的局，都习惯性想到你。<b>出事第一个上，没事第一个挨骂</b>——这是骨干的宿命，也是骨干的荣耀。",
   good:"破局能力：技术天花板+救场王，你的存在让团队敢接硬仗。",
   advice:"能人最大的坑是<b>'独'</b>。让能力被看见的同时让人信得过——别让一手证据输给二手小作文，把证据讲成故事。"},
  {key:"bj", rank:"二甲 · 协调四方", rankGold:false, ico:"🐷", color:"#3d9bd1",
   nm:"猪八戒", pt:"商务协调 · 协调担当", sb:"沟通活泼型 · 团队的润滑剂",
   kws:["危机公关","懂人性","凝聚力"], seal:"L4 治理篇 · 八戒印",
   desc:"你像八戒：看着懒散，其实是团队的<b>气氛组+外交官</b>。大师兄被赶走、团队濒临散伙时，去花果山把人请回来的，是你。懂人性、会说话，是你的超能力。",
   good:"危机公关与凝聚力：能把'散伙'谈成'再扛一程'的人，全团队只有一个。",
   advice:"协调者最大的坑是<b>'只圆不产'</b>。关键时刻牵头一件事——净坛使者那一功，是'请回悟空'挣来的。"},
  {key:"ss", rank:"二甲 · 零失误交付", rankGold:false, ico:"🧑‍🌾", color:"#00a97f",
   nm:"沙 僧", pt:"项目助理 · 执行担当", sb:"靠谱和平型 · 团队的压舱石",
   kws:["件件有着落","任劳任怨","零失误"], seal:"L2 基础篇 · 沙僧印",
   desc:"你像沙僧：话不多，但<b>答应的事件件有着落</b>。资料整理、数据核对、文档收尾——这些活不起眼，却直接决定项目最终的样子。任劳任怨、零失误交付，是你的名片。",
   good:"稳定性与责任心：把最重的担子挑得最稳，是所有团队的压舱石。",
   advice:"执行者最大的坑是<b>'靠谱但隐形'</b>。关键节点留痕、阶段性主动汇报——让'默默干完'变成'有人知道你干完了'。"},
  {key:"blm", rank:"二甲 · 沉默托底", rankGold:false, ico:"🐴", color:"#b8912f",
   nm:"白龙马", pt:"支撑保障 · 后勤担当", sb:"沉默支撑型 · 项目的驮行者",
   kws:["环境就绪","流程隐患","全程托底"], seal:"L1 认知篇 · 白龙马印",
   desc:"你像白龙马：不出声、不抢戏，<b>驮着整个项目跑完全程</b>。环境和工具链是否就绪、流程有没有漏洞、备份做没做——这些没人注意的事，你全都放在心上。你一停摆，全团瘫痪——只是他们平时没意识到。",
   good:"系统性思维与托底能力：你是最早发现流程隐患的人，也是最后离开现场的人。",
   advice:"支撑者最大的坑是<b>'被习惯'</b>。定期让关键干系人知道系统健康度（周报一页即可），别等出事才被想起。"}
];

(function(){
  var wall = document.getElementById('wall');
  wall.innerHTML = ROLES.map(function(r, i){
    return '<div class="card" onclick="openRole('+i+')">'
      + '<div class="rank'+(r.rankGold?' gold':'')+'">'+r.rank+'</div>'
      + '<div class="face" style="background:'+r.color+'">'+r.ico+'</div>'
      + '<div class="nm">'+r.nm+'</div>'
      + '<div class="pt">'+r.pt+'</div>'
      + '<div class="sb">'+r.sb+'</div>'
      + '<div class="kws">'+r.kws.map(function(k){return '<i>'+k+'</i>'}).join('')+'</div>'
      + '<div class="seal">'+r.seal+'</div>'
      + '</div>';
  }).join('');
})();

function openRole(i){
  var r = ROLES[i];
  document.getElementById('dFace').style.background = r.color;
  document.getElementById('dFace').textContent = r.ico;
  document.getElementById('dNm').textContent = r.nm.replace(/ /g,'');
  document.getElementById('dRank').textContent = r.rank;
  document.getElementById('dPt').textContent = r.pt;
  document.getElementById('dSb').textContent = r.sb;
  document.getElementById('dDesc').innerHTML = r.desc;
  document.getElementById('dGood').innerHTML = r.good;
  document.getElementById('dAdvice').innerHTML = r.advice;
  document.getElementById('dFoot').textContent = r.seal + ' ｜ 取经计划 · 角色榜';
  document.getElementById('detailView').classList.add('show');
}
function backWall(){
  document.getElementById('detailView').classList.remove('show');
}
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape') backWall();
});
</script>
</body>
</html>
