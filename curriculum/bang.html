<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>金榜 · 角色榜大屏｜取经计划</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;}
:root{
  --silk-a:#f2d585; --silk-b:#f9e8ae; --silk-c:#eecf78; --silk-d:#f7e29b;
  --ink:#26211a; --ink-soft:#4a4234;
  --zhu:#a62828; --zhu-d:#8c1f1f;
  --wood:#5b3f2b; --wood-l:#79573c;
}
body{
  font-family:"KaiTi","STKaiti","BiauKai",serif;
  background:var(--silk-c);
}
/* ===== 皇宫红墙背景（展陈场景） ===== */
body::before{
  content:"";position:fixed;inset:0;
  background:
    radial-gradient(1400px 700px at 50% -12%, rgba(255,220,150,.16), transparent 60%),
    repeating-linear-gradient(90deg,#8e2723 0 3px,#7c1f1b 3px 6px);
}
/* ===== 木框金榜 ===== */
.board{
  position:fixed;inset:26px 30px;
  border:16px solid;
  border-color:var(--wood-l) var(--wood) var(--wood) var(--wood-l);
  border-radius:4px;
  background:
    linear-gradient(115deg,var(--silk-a) 0%,var(--silk-b) 22%,var(--silk-d) 45%,var(--silk-b) 66%,var(--silk-c) 84%,var(--silk-d) 100%);
  box-shadow:
    inset 0 0 0 2px #c9a44e,
    inset 0 0 26px rgba(120,80,20,.28),
    0 22px 60px rgba(0,0,0,.45);
  overflow:hidden;
}
.board::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(115deg, rgba(255,255,255,.05) 0 2px, transparent 2px 7px);}

/* ===== 竖排正文（从右到左） ===== */
.scroll{
  position:absolute;inset:18px 20px;
  writing-mode:vertical-rl;
  text-orientation:upright;
  display:block;
}
.col{display:inline-block;margin-left:24px;position:relative;color:var(--ink);line-height:1;}
.col.tall{height:100%;}
/* 卷首诰文 */
.zhao{font-size:14.5px;letter-spacing:10px;line-height:2.75;color:var(--ink-soft);}
/* 姓名列（姓名+官职同列） */
.name{font-weight:900;letter-spacing:10px;}
.n1{font-size:47px;}
.n2{font-size:28px;}
.ofc{font-size:12px;letter-spacing:6px;color:var(--ink-soft);margin-top:16px;font-family:"PingFang SC","Microsoft YaHei",sans-serif;line-height:1;}
/* 纪年 */
.nian{font-size:13.5px;letter-spacing:10px;line-height:2.6;color:var(--ink-soft);}
/* 榜字 */
.bang-col{margin-left:38px;}
.bang{
  font-size:400px;font-weight:900;color:#221c14;
  letter-spacing:0;line-height:.98;
  text-shadow:0 0 1px rgba(50,40,20,.4);
  writing-mode:horizontal-tb;text-orientation:mixed;
  transform:translateY(-6px);
}
/* 最左：logo + 二维码 原图竖条 */
.sidecol{margin-left:12px;display:inline-flex;flex-direction:column;align-items:center;gap:20px;writing-mode:horizontal-tb;text-orientation:mixed;}
.sidecol .lg{width:118px;height:118px;}
.sidecol .qr{width:150px;height:150px;background:#fff;padding:7px;box-shadow:0 3px 12px rgba(90,60,10,.25);}

/* ===== 朱底白文方印 ===== */
.seal{
  writing-mode:horizontal-tb;text-orientation:mixed;
  width:54px;height:54px;background:var(--zhu);
  color:#fdf2d8;border-radius:3px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:"KaiTi","STKaiti",serif;font-weight:900;
  box-shadow:0 1px 4px rgba(90,20,10,.4), inset 0 0 0 1.5px rgba(253,242,216,.55);
  position:absolute;left:50%;transform:translateX(-50%);
  line-height:1.05;
}
.seal b{font-size:17px;display:block;}
.seal i{font-style:normal;font-size:13px;display:block;}
.col .seal{top:2px;}
/* 诰文列总印 */
.zhao-wrap .seal{position:static;transform:none;margin-top:14px;}

/* 姓名列可点击 */
.clickable{cursor:pointer;transition:filter .15s;}
.clickable:hover{filter:brightness(1.06) drop-shadow(0 0 6px rgba(166,40,40,.35));}

/* ===== 单角色卷轴（黄绫） ===== */
.detail{position:fixed;inset:0;display:none;z-index:60;background:radial-gradient(1000px 600px at 50% -10%, #f9e9b4, transparent 65%),linear-gradient(160deg,var(--silk-d),var(--silk-a));}
.detail.show{display:flex;align-items:center;justify-content:center;}
.d-board{width:82%;height:84%;border:12px solid;border-color:var(--wood-l) var(--wood) var(--wood) var(--wood-l);
  border-radius:4px;box-shadow:inset 0 0 0 2px #c9a44e, 0 18px 50px rgba(0,0,0,.4);
  position:relative;display:flex;padding:34px 54px;gap:44px;align-items:center;}
.d-left{flex:0 0 250px;display:flex;flex-direction:column;align-items:center;gap:16px;}
.d-face{width:158px;height:158px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:84px;color:#fff;
  box-shadow:0 10px 28px rgba(40,30,10,.35), inset 0 0 0 4px rgba(255,255,255,.4);}
.d-nm{font-family:"KaiTi","STKaiti",serif;font-size:46px;font-weight:900;letter-spacing:12px;color:var(--ink);}
.d-rank{writing-mode:vertical-rl;text-orientation:upright;font-size:15px;letter-spacing:4px;color:#fdf2d8;background:var(--zhu);padding:14px 8px;border-radius:5px;font-weight:800;}
.d-body{flex:1;min-width:0;color:var(--ink);}
.d-body .pt{font-family:"KaiTi","STKaiti",serif;font-size:27px;font-weight:900;color:#6e4a10;letter-spacing:4px;}
.d-body .sb{font-size:14px;color:var(--ink-soft);margin-top:6px;letter-spacing:2px;}
.d-body .desc{margin-top:16px;font-size:15.5px;line-height:2.05;text-align:justify;color:#3c3527;}
.d-body .desc b{color:var(--zhu-d);}
.d-rows{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px;}
.d-row{background:rgba(255,252,240,.72);border:1.5px solid #cfa54a;border-radius:8px;padding:12px 16px;}
.d-row h4{font-size:13px;color:#6e4a10;letter-spacing:3px;margin-bottom:6px;font-weight:900;}
.d-row h4 em{font-style:normal;color:var(--zhu);margin-right:6px;}
.d-row p{font-size:13.5px;line-height:1.9;color:#423a2b;}
.d-row p b{color:var(--zhu-d);}
.d-back{position:absolute;left:22px;top:18px;cursor:pointer;z-index:9;
  font-family:"KaiTi","STKaiti",serif;font-size:15px;font-weight:900;letter-spacing:3px;color:#fdf2d8;
  background:var(--zhu);border-radius:6px;padding:7px 18px;box-shadow:0 3px 10px rgba(90,20,10,.35);}
.d-back:hover{background:var(--zhu-d);}
.d-foot{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-size:12px;letter-spacing:4px;color:var(--ink-soft);}
</style>
</head>
<body>

<div class="board">
  <div class="scroll">

    <!-- 最右：卷首诰文 + 总印 -->
    <div class="col tall zhao-wrap">
      <div class="zhao">奉天承运 取经计划制曰 丙午年春 策试取经团队观音等六人 第一甲赐项目管理及第 第二甲赐团队角色出身 故兹诰示</div>
      <div class="seal"><b>取经</b><i>计划</i></div>
    </div>

    <!-- 一甲 · 观音 -->
    <div class="col clickable" onclick="openRole(0)">
      <div class="seal"><b>观音</b><i>令</i></div>
      <div class="name n1" style="margin-top:70px">觀音</div>
      <div class="ofc">PMO總監·項目治理</div>
    </div>

    <!-- 一甲 · 唐僧 -->
    <div class="col clickable" onclick="openRole(1)">
      <div class="seal"><b>通識</b><i>印</i></div>
      <div class="name n1" style="margin-top:70px">唐僧</div>
      <div class="ofc">項目經理·掌舵</div>
    </div>

    <!-- 一甲 · 悟空 -->
    <div class="col clickable" onclick="openRole(2)">
      <div class="seal"><b>實戰</b><i>印</i></div>
      <div class="name n1" style="margin-top:70px">孫悟空</div>
      <div class="ofc">技術總監·攻堅</div>
    </div>

    <!-- 二甲 · 八戒 -->
    <div class="col clickable" onclick="openRole(3)">
      <div class="seal"><b>治理</b><i>印</i></div>
      <div class="name n2" style="margin-top:64px">豬八戒</div>
      <div class="ofc">商務協調</div>
    </div>

    <!-- 二甲 · 沙僧 -->
    <div class="col clickable" onclick="openRole(4)">
      <div class="seal"><b>工具</b><i>印</i></div>
      <div class="name n2" style="margin-top:64px">沙僧</div>
      <div class="ofc">項目助理</div>
    </div>

    <!-- 二甲 · 白龙马 -->
    <div class="col clickable" onclick="openRole(5)">
      <div class="seal"><b>認知</b><i>印</i></div>
      <div class="name n2" style="margin-top:64px">白龍馬</div>
      <div class="ofc">支撑保障</div>
    </div>

    <!-- 卷尾纪年 -->
    <div class="col tall nian">丙午年 春月 吉日 謹識</div>

    <!-- 榜字（特大、无修饰） -->
    <div class="col bang-col"><div class="bang">榜</div></div>

    <!-- 最左：logo 原图 + 二维码（仅码图） -->
    <div class="col sidecol">
      <img class="lg" src="seal/logo-qj.svg" alt="取经计划">
      <img class="qr" src="images-qr-test.svg" alt="扫码自测">
    </div>

  </div>
</div>

<!-- ===== 单角色卷轴 ===== -->
<div class="detail" id="detailView">
  <div class="d-board">
    <div class="d-back" onclick="backWall()">‹ 返回金榜</div>
    <div class="d-left">
      <div class="d-face" id="dFace"></div>
      <div class="d-nm" id="dNm"></div>
      <div class="d-rank" id="dRank"></div>
    </div>
    <div class="d-body">
      <div class="pt" id="dPt"></div>
      <div class="sb" id="dSb"></div>
      <div class="desc" id="dDesc"></div>
      <div class="d-rows">
        <div class="d-row"><h4><em>◈</em>你的天赋</h4><p id="dGood"></p></div>
        <div class="d-row"><h4><em>◈</em>要防的坑</h4><p id="dAdvice"></p></div>
      </div>
    </div>
    <div class="d-foot" id="dFoot"></div>
  </div>
</div>

<script>
var ROLES = [
  {key:"gy", rank:"特設 · 取經項目辦", ico:"🎐", color:"#8a6400",
   nm:"观音", pt:"PMO 总监 · 项目治理者", sb:"治理统御型 · 不出场打妖，却决定项目成败",
   desc:"你像观音：不替悟空打妖、不替唐僧念经，却让十四年取经路一路闭环。<b>你的价值不在\"亲自干\"，而在让所有人的\"干\"成为体系</b>——立项领命、点将授权、制度红线、里程碑督导、验收发证，一环不缺。能人解决一场战斗，你保证每个项目都打得赢。",
   good:"治理与体系化：把能人组织成体系，把偶然的胜利变成可复制的成功。",
   advice:"治理者最大的坑是<b>'管得过界'</b>。记住观音的'不是'：不顶替项目经理决策、不替一线干具体活——该管的管到，不该管的别碰。",
   foot:"番外 · PMO 总监课 · 观音令"},
  {key:"ts", rank:"一甲 · 執掌方向", ico:"🧘", color:"#8f5bbf",
   nm:"唐僧", pt:"项目经理 · 掌舵人", sb:"目标坚定型 · 天生定方向的人",
   desc:"你像唐僧：不打妖怪，但决定往哪打。你的价值在于<b>目标坚定、守住底线、扛起最终责任</b>——团队迷茫时，你是那个说'我们到底为什么而战'的人。你未必是团队里最能干的，但你是最不可替代的。",
   good:"愿景与定力：面对诱惑（女儿国式变更）和压力，你比谁都稳。",
   advice:"掌舵人最大的坑是<b>'只对上负责'</b>。多听一手信息，别让权威代替倾听——三打白骨精上的误判，是你的前车之鉴。",
   foot:"L+ 通识全景课 · 唐僧印"},
  {key:"wk", rank:"一甲 · 攻堅克難", ico:"🐒", color:"#e65c00",
   nm:"孙悟空", pt:"技术总监 · 技术担当", sb:"攻坚力量型 · 硬仗全靠你",
   desc:"你像悟空：能力越强，责任越大。团队里最难的活、最险的局，都习惯性想到你。<b>出事第一个上，没事第一个挨骂</b>——这是骨干的宿命，也是骨干的荣耀。",
   good:"破局能力：技术天花板+救场王，你的存在让团队敢接硬仗。",
   advice:"能人最大的坑是<b>'独'</b>。让能力被看见的同时让人信得过——别让一手证据输给二手小作文，把证据讲成故事。",
   foot:"L3 实战篇 · 悟空印"},
  {key:"bj", rank:"二甲 · 協調四方", ico:"🐷", color:"#3d9bd1",
   nm:"猪八戒", pt:"商务协调 · 协调担当", sb:"沟通活泼型 · 团队的润滑剂",
   desc:"你像八戒：看着懒散，其实是团队的<b>气氛组+外交官</b>。大师兄被赶走、团队濒临散伙时，去花果山把人请回来的，是你。懂人性、会说话，是你的超能力。",
   good:"危机公关与凝聚力：能把'散伙'谈成'再扛一程'的人，全团队只有一个。",
   advice:"协调者最大的坑是<b>'只圆不产'</b>。关键时刻牵头一件事——净坛使者那一功，是'请回悟空'挣来的。",
   foot:"L4 治理篇 · 八戒印"},
  {key:"ss", rank:"二甲 · 零失誤交付", ico:"🧑‍🌾", color:"#00a97f",
   nm:"沙僧", pt:"项目助理 · 执行担当", sb:"靠谱和平型 · 团队的压舱石",
   desc:"你像沙僧：话不多，但<b>答应的事件件有着落</b>。资料整理、数据核对、文档收尾——这些活不起眼，却直接决定项目最终的样子。任劳任怨、零失误交付，是你的名片。",
   good:"稳定性与责任心：把最重的担子挑得最稳，是所有团队的压舱石。",
   advice:"执行者最大的坑是<b>'靠谱但隐形'</b>。关键节点留痕、阶段性主动汇报——让'默默干完'变成'有人知道你干完了'。",
   foot:"L2 基础篇 · 沙僧印"},
  {key:"blm", rank:"二甲 · 沉默托底", ico:"🐴", color:"#b8912f",
   nm:"白龙马", pt:"支撑保障 · 后勤担当", sb:"沉默支撑型 · 项目的驮行者",
   desc:"你像白龙马：不出声、不抢戏，<b>驮着整个项目跑完全程</b>。环境和工具链是否就绪、流程有没有漏洞、备份做没做——这些没人注意的事，你全都放在心上。你一停摆，全团瘫痪——只是他们平时没意识到。",
   good:"系统性思维与托底能力：你是最早发现流程隐患的人，也是最后离开现场的人。",
   advice:"支撑者最大的坑是<b>'被习惯'</b>。定期让关键干系人知道系统健康度（周报一页即可），别等出事才被想起。",
   foot:"L1 认知篇 · 白龙马印"}
];

function openRole(i){
  var r = ROLES[i];
  document.getElementById('dFace').style.background = r.color;
  document.getElementById('dFace').textContent = r.ico;
  document.getElementById('dNm').textContent = r.nm;
  document.getElementById('dRank').textContent = r.rank;
  document.getElementById('dPt').textContent = r.pt;
  document.getElementById('dSb').textContent = r.sb;
  document.getElementById('dDesc').innerHTML = r.desc;
  document.getElementById('dGood').innerHTML = r.good;
  document.getElementById('dAdvice').innerHTML = r.advice;
  document.getElementById('dFoot').textContent = r.foot + ' ｜ 取经计划 · 金榜';
  document.getElementById('detailView').classList.add('show');
}
function backWall(){
  document.getElementById('detailView').classList.remove('show');
}
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape') backWall();
});
</script>
</body>
</html>
