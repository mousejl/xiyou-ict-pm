<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>角色榜 · 大屏｜取经计划</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;}
:root{
  --paper:#fdfbf5; --line:#ddd5c4; --dash:#c9be9d;
  --gold:#b8912f; --gold-d:#8a6400;
  --ink:#1a1d24; --sub:#6a6a76;
}
body{
  font-family:"KaiTi","STKaiti","BiauKai","PingFang SC","Microsoft YaHei",serif;
  background:
    radial-gradient(900px 500px at 50% -8%, rgba(255,252,240,.9), transparent 65%),
    radial-gradient(700px 400px at 90% 110%, rgba(210,195,160,.35), transparent 60%),
    linear-gradient(115deg,#fdfbf5,#f7f1e2);
  color:var(--ink);
}
body::after{content:"";position:fixed;inset:0;pointer-events:none;
  box-shadow:inset 0 0 70px rgba(120,95,40,.16), inset 0 0 16px rgba(120,95,40,.08);}

.sheet{position:fixed;inset:16px 24px;display:flex;flex-direction:column;}

/* ===== 顶部：榜字 + 标题 + logo/二维码 ===== */
.header{flex:0 0 auto;display:flex;align-items:center;gap:18px;padding:2px 8px 10px;
  border-bottom:1.5px solid var(--dash);}
.bang{font-size:50px;font-weight:900;line-height:.95;color:var(--ink);letter-spacing:0;
  writing-mode:vertical-rl;text-orientation:upright;flex:0 0 auto;}
.title{flex:1;min-width:0;}
.title h1{font-size:20px;font-weight:900;letter-spacing:6px;color:var(--ink);}
.title p{font-size:11.5px;letter-spacing:.28em;color:var(--sub);margin-top:4px;}
.title p b{color:var(--gold-d);}
.brand{flex:0 0 auto;display:flex;align-items:center;gap:14px;}
.brand .lg{width:52px;height:52px;}
.brand .qr{width:60px;height:60px;background:#fff;padding:3px;border-radius:4px;box-shadow:0 2px 8px rgba(90,60,10,.18);}

/* ===== 主体：六角色印格（通关文牒 stampboxs 样式，3列×2行） ===== */
.stampboxs{flex:1;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,minmax(0,1fr));gap:12px;padding:12px 4px 8px;min-height:0;}
.stamp{
  border:2px dashed var(--dash);border-radius:12px;padding:8px 8px;
  background:#fffdf8;text-align:center;cursor:pointer;min-height:0;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  transition:transform .15s, box-shadow .15s, border-color .15s;
}
.stamp:hover{transform:translateY(-3px);border-color:var(--gold);box-shadow:0 8px 18px rgba(138,100,0,.16);}
.stamp .rk{font-size:11.5px;letter-spacing:.2em;color:var(--gold-d);font-weight:700;}
.stamp .seal{width:auto;height:auto;max-width:64px;max-height:64px;margin:1px auto;display:block;transform:rotate(-6deg);}
.stamp .nm{font-family:"KaiTi","STKaiti",serif;font-size:28px;font-weight:900;letter-spacing:6px;color:var(--ink);line-height:1.05;}
.stamp .ro{font-size:11.5px;letter-spacing:.06em;color:var(--sub);}

/* ===== 底部：认证框（crownbox 样式） ===== */
.crownbox{flex:0 0 auto;margin-top:2px;border:2px solid var(--gold);border-radius:10px;padding:7px 16px;text-align:center;
  background:linear-gradient(135deg,#fdf8ec,#fffdf7);}
.crownbox b{color:var(--gold-d);font-size:13.5px;letter-spacing:2px;}
.crownbox p{font-size:12px;color:var(--sub);margin-top:2px;letter-spacing:.08em;}

/* ===== 单人详情 ===== */
.detail{position:fixed;inset:0;display:none;z-index:60;background:rgba(60,45,15,.4);}
.detail.show{display:flex;align-items:center;justify-content:center;}
.d-board{width:80%;height:82%;background:linear-gradient(115deg,#fdfbf5,#f7f1e2);
  border:2px dashed var(--dash);border-radius:16px;box-shadow:0 20px 55px rgba(40,25,0,.45);
  position:relative;display:flex;padding:32px 50px;gap:42px;align-items:center;}
.d-left{flex:0 0 250px;display:flex;flex-direction:column;align-items:center;gap:14px;}
.d-face{width:148px;height:148px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:78px;color:#fff;
  box-shadow:0 10px 26px rgba(40,30,10,.3), inset 0 0 0 4px rgba(255,255,255,.4);}
.d-nm{font-size:44px;font-weight:900;letter-spacing:10px;color:var(--ink);}
.d-rank{font-size:13px;font-weight:800;color:#fdf2d8;background:#a62828;padding:4px 18px;border-radius:4px;letter-spacing:.22em;}
.d-body{flex:1;min-width:0;}
.d-body .pt{font-size:26px;font-weight:900;color:var(--gold-d);letter-spacing:3px;}
.d-body .sb{font-size:13.5px;color:var(--sub);margin-top:5px;letter-spacing:1px;}
.d-body .desc{margin-top:14px;font-size:15px;line-height:2;text-align:justify;color:#332a1c;}
.d-body .desc b{color:#a62828;}
.d-rows{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px;}
.d-row{background:rgba(255,252,240,.8);border:1.5px solid var(--dash);border-radius:8px;padding:11px 15px;}
.d-row h4{font-size:12.5px;color:var(--gold-d);letter-spacing:.2em;margin-bottom:5px;font-weight:800;}
.d-row h4 em{font-style:normal;color:#a62828;margin-right:5px;}
.d-row p{font-size:13px;line-height:1.85;color:#3a3223;}
.d-row p b{color:#a62828;}
.d-back{position:absolute;left:20px;top:16px;cursor:pointer;z-index:9;
  font-size:13.5px;font-weight:800;letter-spacing:.08em;color:#fdf2d8;background:#a62828;
  border-radius:6px;padding:7px 16px;box-shadow:0 3px 10px rgba(90,20,10,.3);}
.d-back:hover{background:#8c1f1f;}
.d-foot{position:absolute;bottom:12px;left:0;right:0;text-align:center;font-size:11.5px;letter-spacing:.25em;color:var(--sub);}
</style>
</head>
<body>

<div class="sheet">

  <!-- 顶部：榜字 + 标题 + logo/二维码 -->
  <div class="header">
    <div class="bang">榜</div>
    <div class="title">
      <h1>取经计划 · 项目管理训练营</h1>
      <p>角色榜 <b>·</b> 丙午年 春月 吉日 <b>·</b> 点击任一印格，展开单人金榜</p>
    </div>
    <div class="brand">
      <img class="lg" src="seal/logo-qj.svg" alt="取经计划">
      <img class="qr" src="images-qr-test.svg" alt="扫码自测">
    </div>
  </div>

  <!-- 六角色印格 -->
  <div class="stampboxs">
    <div class="stamp" onclick="openRole(0)">
      <span class="rk">第一甲第一名</span>
      <img class="seal" src="seal/official-seal.svg" alt="观音">
      <span class="nm">觀音</span>
      <span class="ro">取經項目辦·PMO總監</span>
    </div>
    <div class="stamp" onclick="openRole(1)">
      <span class="rk">第一甲第二名</span>
      <img class="seal" src="seal/seal-l0.svg" alt="唐僧">
      <span class="nm">唐僧</span>
      <span class="ro">項目經理·掌舵人</span>
    </div>
    <div class="stamp" onclick="openRole(2)">
      <span class="rk">第一甲第三名</span>
      <img class="seal" src="seal/seal-l3.svg" alt="孙悟空">
      <span class="nm">孫悟空</span>
      <span class="ro">技術總監·技術擔當</span>
    </div>
    <div class="stamp" onclick="openRole(3)">
      <span class="rk">第二甲第一名</span>
      <img class="seal" src="seal/seal-l4.svg" alt="猪八戒">
      <span class="nm">豬八戒</span>
      <span class="ro">商務協調·協調擔當</span>
    </div>
    <div class="stamp" onclick="openRole(4)">
      <span class="rk">第二甲第二名</span>
      <img class="seal" src="seal/seal-l2.svg" alt="沙僧">
      <span class="nm">沙僧</span>
      <span class="ro">項目助理·執行擔當</span>
    </div>
    <div class="stamp" onclick="openRole(5)">
      <span class="rk">第二甲第三名</span>
      <img class="seal" src="seal/seal-l1.svg" alt="白龙马">
      <span class="nm">白龍馬</span>
      <span class="ro">支撑保障·後勤擔當</span>
    </div>
  </div>

  <!-- 底部认证框 -->
  <div class="crownbox">
    <b>📜 扫码自测 · 测测你是取经团队里的谁</b>
    <p>手机扫描右上二维码直达自测 H5 ｜ 六角色对应项目管理岗位 · 点击印格查看角色详解</p>
  </div>

</div>

<!-- ===== 单人详情 ===== -->
<div class="detail" id="detailView">
  <div class="d-board">
    <div class="d-back" onclick="backWall()">‹ 返回金榜</div>
    <div class="d-left">
      <div class="d-face" id="dFace"></div>
      <div class="d-nm" id="dNm"></div>
      <div class="d-rank" id="dRank"></div>
    </div>
    <div class="d-body">
      <div class="pt" id="dPt"></div>
      <div class="sb" id="dSb"></div>
      <div class="desc" id="dDesc"></div>
      <div class="d-rows">
        <div class="d-row"><h4><em>◈</em>你的天赋</h4><p id="dGood"></p></div>
        <div class="d-row"><h4><em>◈</em>要防的坑</h4><p id="dAdvice"></p></div>
      </div>
    </div>
    <div class="d-foot" id="dFoot"></div>
  </div>
</div>

<script>
var ROLES = [
  {key:"gy", rank:"特设 · 取经项目办", ico:"🎐", color:"#8a6400",
   nm:"观音", pt:"PMO 总监 · 项目治理者", sb:"治理统御型 · 不出场打妖，却决定项目成败",
   desc:"你像观音：不替悟空打妖、不替唐僧念经，却让十四年取经路一路闭环。<b>你的价值不在\"亲自干\"，而在让所有人的\"干\"成为体系</b>——立项领命、点将授权、制度红线、里程碑督导、验收发证，一环不缺。能人解决一场战斗，你保证每个项目都打得赢。",
   good:"治理与体系化：把能人组织成体系，把偶然的胜利变成可复制的成功。",
   advice:"治理者最大的坑是<b>'管得过界'</b>。记住观音的'不是'：不顶替项目经理决策、不替一线干具体活——该管的管到，不该管的别碰。",
   foot:"番外 · PMO 总监课 · 观音令"},
  {key:"ts", rank:"一甲 · 执掌方向", ico:"🧘", color:"#8f5bbf",
   nm:"唐僧", pt:"项目经理 · 掌舵人", sb:"目标坚定型 · 天生定方向的人",
   desc:"你像唐僧：不打妖怪，但决定往哪打。你的价值在于<b>目标坚定、守住底线、扛起最终责任</b>——团队迷茫时，你是那个说'我们到底为什么而战'的人。你未必是团队里最能干的，但你是最不可替代的。",
   good:"愿景与定力：面对诱惑（女儿国式变更）和压力，你比谁都稳。",
   advice:"掌舵人最大的坑是<b>'只对上负责'</b>。多听一手信息，别让权威代替倾听——三打白骨精上的误判，是你的前车之鉴。",
   foot:"L+ 通识全景课 · 唐僧印"},
  {key:"wk", rank:"一甲 · 攻坚克难", ico:"🐒", color:"#e65c00",
   nm:"孙悟空", pt:"技术总监 · 技术担当", sb:"攻坚力量型 · 硬仗全靠你",
   desc:"你像悟空：能力越强，责任越大。团队里最难的活、最险的局，都习惯性想到你。<b>出事第一个上，没事第一个挨骂</b>——这是骨干的宿命，也是骨干的荣耀。",
   good:"破局能力：技术天花板+救场王，你的存在让团队敢接硬仗。",
   advice:"能人最大的坑是<b>'独'</b>。让能力被看见的同时让人信得过——别让一手证据输给二手小作文，把证据讲成故事。",
   foot:"L3 实战篇 · 悟空印"},
  {key:"bj", rank:"二甲 · 协调四方", ico:"🐷", color:"#3d9bd1",
   nm:"猪八戒", pt:"商务协调 · 协调担当", sb:"沟通活泼型 · 团队的润滑剂",
   desc:"你像八戒：看着懒散，其实是团队的<b>气氛组+外交官</b>。大师兄被赶走、团队濒临散伙时，去花果山把人请回来的，是你。懂人性、会说话，是你的超能力。",
   good:"危机公关与凝聚力：能把'散伙'谈成'再扛一程'的人，全团队只有一个。",
   advice:"协调者最大的坑是<b>'只圆不产'</b>。关键时刻牵头一件事——净坛使者那一功，是'请回悟空'挣来的。",
   foot:"L4 治理篇 · 八戒印"},
  {key:"ss", rank:"二甲 · 零失误交付", ico:"🧑‍🌾", color:"#00a97f",
   nm:"沙僧", pt:"项目助理 · 执行担当", sb:"靠谱和平型 · 团队的压舱石",
   desc:"你像沙僧：话不多，但<b>答应的事件件有着落</b>。资料整理、数据核对、文档收尾——这些活不起眼，却直接决定项目最终的样子。任劳任怨、零失误交付，是你的名片。",
   good:"稳定性与责任心：把最重的担子挑得最稳，是所有团队的压舱石。",
   advice:"执行者最大的坑是<b>'靠谱但隐形'</b>。关键节点留痕、阶段性主动汇报——让'默默干完'变成'有人知道你干完了'。",
   foot:"L2 基础篇 · 沙僧印"},
  {key:"blm", rank:"二甲 · 沉默托底", ico:"🐴", color:"#b8912f",
   nm:"白龙马", pt:"支撑保障 · 后勤担当", sb:"沉默支撑型 · 项目的驮行者",
   desc:"你像白龙马：不出声、不抢戏，<b>驮着整个项目跑完全程</b>。环境和工具链是否就绪、流程有没有漏洞、备份做没做——这些没人注意的事，你全都放在心上。你一停摆，全团瘫痪——只是他们平时没意识到。",
   good:"系统性思维与托底能力：你是最早发现流程隐患的人，也是最后离开现场的人。",
   advice:"支撑者最大的坑是<b>'被习惯'</b>。定期让关键干系人知道系统健康度（周报一页即可），别等出事才被想起。",
   foot:"L1 认知篇 · 白龙马印"}
];

function openRole(i){
  var r = ROLES[i];
  document.getElementById('dFace').style.background = r.color;
  document.getElementById('dFace').textContent = r.ico;
  document.getElementById('dNm').textContent = r.nm;
  document.getElementById('dRank').textContent = r.rank;
  document.getElementById('dPt').textContent = r.pt;
  document.getElementById('dSb').textContent = r.sb;
  document.getElementById('dDesc').innerHTML = r.desc;
  document.getElementById('dGood').innerHTML = r.good;
  document.getElementById('dAdvice').innerHTML = r.advice;
  document.getElementById('dFoot').textContent = r.foot + ' ｜ 取经计划 · 角色榜';
  document.getElementById('detailView').classList.add('show');
}
function backWall(){
  document.getElementById('detailView').classList.remove('show');
}
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape') backWall();
});
</script>
</body>
</html>
