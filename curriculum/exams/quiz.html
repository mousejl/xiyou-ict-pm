<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>结业在线测验｜取经计划</title>
<style>
  :root{--ink:#2b2a26;--sub:#6b6353;--paper:#fff;--line:#e8e0d0;--gold:#c9a64a;--goldD:#a5843a;}
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{background:#efece3;font-family:"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);line-height:1.7;padding-bottom:76px}
  .app{max-width:680px;margin:0 auto}
  /* 选择页 */
  .hero{background:linear-gradient(135deg,#1b1e26,#0c0e11);color:#efece3;padding:30px 22px 24px;text-align:center}
  .hero .k{font-size:11px;letter-spacing:.35em;color:var(--gold);opacity:.9}
  .hero h1{font-size:23px;letter-spacing:3px;margin:8px 0 4px}
  .hero p{font-size:12.5px;opacity:.75}
  .cards{padding:18px 16px 30px;display:flex;flex-direction:column;gap:14px}
  .card{display:block;text-decoration:none;color:var(--ink);background:#fff;border-radius:12px;padding:16px 16px 14px;box-shadow:0 3px 12px rgba(0,0,0,.06);border-left:5px solid var(--tc)} 
  .card b{font-size:16.5px;display:block;margin-bottom:2px}
  .card .lv{font-size:11px;color:#fff;background:var(--tc);border-radius:4px;padding:1px 8px;letter-spacing:1px}
  .card p{font-size:12.5px;color:var(--sub);margin-top:4px}
  .card .go{font-size:12px;color:var(--tc);font-weight:700;margin-top:8px}
  /* 答题页 */
  .bar{position:sticky;top:0;z-index:30;background:var(--ink);color:#efece3;padding:10px 16px}
  .bar .row1{display:flex;align-items:center;gap:10px}
  .bar .name{font-size:14px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar .name em{font-style:normal;color:var(--gold);font-size:11px;margin-right:6px;letter-spacing:1px}
  .bar .cnt{font-size:12px;opacity:.85;font-variant-numeric:tabular-nums}
  .pbar{height:4px;background:rgba(255,255,255,.15);border-radius:3px;margin-top:8px;overflow:hidden}
  .pbar i{display:block;height:100%;background:var(--gold);width:0;transition:width .25s;border-radius:3px}
  .body{padding:16px 14px 20px;display:flex;flex-direction:column;gap:14px}
  .sec{display:flex;align-items:center;gap:8px;margin:6px 0 -2px}
  .sec .t{font-size:13px;font-weight:800;color:var(--ink)}
  .sec .pts{font-size:11px;color:var(--sub)}
  .sec .l{height:1px;flex:1;background:var(--line)}
  .q{background:#fff;border-radius:12px;padding:14px 14px 12px;box-shadow:0 3px 12px rgba(0,0,0,.05);border:1.5px solid transparent}
  .q .qt{font-size:15px;font-weight:600}
  .q .qt .n{color:var(--tc);font-weight:800;margin-right:4px}
  .q .tag{display:inline-block;font-size:10px;color:#fff;background:var(--tc);opacity:.85;border-radius:3px;padding:0 6px;margin-left:6px;vertical-align:2px}
  .opts{margin-top:10px;display:flex;flex-direction:column;gap:8px}
  .opt{display:flex;align-items:flex-start;gap:9px;padding:9px 11px;border:1.5px solid var(--line);border-radius:9px;font-size:14.5px;cursor:pointer;user-select:none;background:#fff;transition:all .12s}
  .opt .k{flex:0 0 auto;width:22px;height:22px;border-radius:50%;border:1.5px solid #c8c0b0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--sub)}
  .opt:active{transform:scale(.99)}
  .opt.on{border-color:var(--tc);background:var(--tcBg)}
  .opt.on .k{background:var(--tc);border-color:var(--tc);color:#fff}
  .opts.two{flex-direction:row}
  .opts.two .opt{flex:1;justify-content:center;padding:11px}
  .lock .opt{pointer-events:none}
  .q.wrong{border-color:#E53935}
  .q.right{border-color:#00b377}
  .q .judge{display:inline-flex;gap:6px;margin-top:10px}
  .q .judge div{padding:8px 26px;border:1.5px solid var(--line);border-radius:9px;font-size:15px;font-weight:700;cursor:pointer}
  .q .judge div.on{background:var(--tcBg);border-color:var(--tc);color:var(--tc)}
  .fb{margin-top:10px;font-size:12.5px;border-top:1px dashed var(--line);padding-top:8px;color:var(--sub)}
  .fb b.ok{color:#00a06a}.fb b.bad{color:#E53935}
  /* 底部交卷 */
  .foot{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,253,.96);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:30}
  .foot .in{max-width:680px;margin:0 auto;display:flex;gap:12px;align-items:center}
  .foot .tip{font-size:11.5px;color:var(--sub);flex:1}
  .btn{appearance:none;border:none;border-radius:10px;font-size:15.5px;font-weight:800;padding:12px 26px;cursor:pointer;letter-spacing:2px}
  .btn.p{color:#fff;background:linear-gradient(135deg,var(--tc),var(--tc2))}
  .btn.g{background:#f0ece0;color:var(--ink)}
  /* 成绩页 */
  .score{background:#fff;border-radius:0 0 18px 18px;padding:30px 20px 26px;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.06)}
  .score .num{font-size:64px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
  .score .of{font-size:15px;color:var(--sub);margin-top:2px}
  .verdict{display:inline-block;margin-top:10px;font-size:13px;font-weight:700;padding:4px 16px;border-radius:99px;color:#fff}
  .stats{display:flex;gap:10px;margin-top:18px}
  .stats div{flex:1;background:#faf7ef;border-radius:10px;padding:10px 4px;font-size:12px;color:var(--sub)}
  .stats b{display:block;font-size:17px;color:var(--ink)}
  .meta2{font-size:12px;color:var(--sub);margin-top:14px}
  .wrap2{max-width:680px;margin:0 auto;padding:18px 14px 30px}
  .acts{display:flex;gap:12px;justify-content:center;margin-top:18px;flex-wrap:wrap}
  .wronglist{margin-top:18px;display:flex;flex-direction:column;gap:14px}
  .wl-t{font-size:14px;font-weight:800;color:var(--ink)}
  .wl-t span{font-weight:400;color:var(--sub);font-size:12px}
  .allright{text-align:center;font-size:14.5px;font-weight:700;color:#00a06a;background:#fff;border-radius:12px;padding:22px;margin-top:14px}
  /* 成绩上报 */
  .report{background:#fff;border-radius:12px;padding:16px;margin-top:18px;box-shadow:0 3px 12px rgba(0,0,0,.05);border:1px solid var(--line)}
  .report .rt{font-size:14.5px;font-weight:800;color:var(--tc)}
  .report .rt span{display:block;font-size:11.5px;font-weight:400;color:var(--sub);margin-top:2px}
  .rrow{display:flex;gap:8px;margin-top:10px}
  .rrow input{flex:1;min-width:0;padding:9px 10px;border:1.5px solid var(--line);border-radius:8px;font-size:13.5px;background:#fdfbf5;outline:none}
  .rrow input:focus{border-color:var(--tc)}
  .rbtn{margin-top:12px;display:flex;align-items:center;gap:10px}
  .rbtn button{appearance:none;border:none;border-radius:9px;padding:10px 26px;font-size:14px;font-weight:800;letter-spacing:2px;color:#fff;cursor:pointer;background:linear-gradient(135deg,var(--tc),var(--tc2))}
  .rbtn button:disabled{opacity:.45;cursor:default}
  .rmsg{font-size:12px;color:var(--sub)}
  .rmsg.ok{color:#00a06a;font-weight:700}
  .rmsg.bad{color:#E53935}
  .rlink{font-size:11.5px;color:var(--tc);cursor:pointer;text-decoration:underline}
  @media print{.report{display:none}}
  @media print{.foot{display:none}}
</style>
</head>

<div class="app" id="app"></div>

    inner = `<div class="judge">
      <div data-k="1" class="${v===1?'on':''}">正确 √</div>
      <div data-k="0" class="${v===0?'on':''}">错误 ×</div></div>`;
  } else {
    inner = '<div class="opts">' + def[1].map((o,oi)=>`
      <div class="opt ${ans[id]===oi?'on':''}" data-k="${oi}"><span class="k">${letter(oi)}</span><span>${o}</span></div>`).join('') + '</div>';
  }
  const typeName = type==='s' ? '单选' : type==='m' ? '多选' : '判断';
  const pts = type==='m' ? '3分' : '2分';
  return `<div class="q" id="q-${id}">
    <div class="qt"><span class="n" style="color:${exam_.theme[0]}">${i+1}</span>${def[0]}<span class="tag" style="background:${exam_.theme[0]}">${typeName}·${pts}</span></div>
    ${inner}
  </div>`;
}
function renderQuiz(){
  document.documentElement.style.setProperty('--tc', exam.theme[0]);
  document.documentElement.style.setProperty('--tc2', exam.theme[1]);
  document.documentElement.style.setProperty('--tcBg', exam.theme[0] + '14');
  const total = 45;
  const done = Object.keys(ans).length;
  $('#app').innerHTML = `
    <div class="bar" style="background:linear-gradient(135deg,${exam.theme[0]},${exam.theme[1]})">
      <div class="row1"><div class="name"><em>取经计划</em>${exam.name} · 结业测验</div><div class="cnt">${done}/${total}</div></div>
      <div class="pbar"><i id="pb" style="width:${(done/total*100).toFixed(1)}%"></i></div>
    </div>
    <div class="body">
      <div class="sec"><span class="t">一、单项选择题</span><span class="pts">每题2分</span><span class="l"></span></div>
      ${exam.single.map((d,i)=>qCard('s',i,d)).join('')}
      <div class="sec"><span class="t">二、多项选择题</span><span class="pts">每题3分 · 多选少选错选不得分</span><span class="l"></span></div>
      ${exam.multi.map((d,i)=>qCard('m',i,d)).join('')}
      <div class="sec"><span class="t">三、判断题</span><span class="pts">每题2分</span><span class="l"></span></div>
      ${exam.judge.map((d,i)=>qCard('j',i,d)).join('')}
    </div>
    <div class="foot"><div class="in">
      <div class="tip">已答 <b id="fc">${done}</b>/${total} · 进度自动保存，回退不丢答案</div>
      <button class="btn g" onclick="history.length>1?history.back():location.href='quiz.html'">返回</button>
      <button class="btn p" onclick="submit()">交 卷</button>
    </div></div>`;
  // 绑定事件
  document.querySelectorAll('.q').forEach(q=>{
    const id = q.id.slice(2);
    q.querySelectorAll('.opt').forEach(o=>{
      o.addEventListener('click', ()=>{
        const k = +o.dataset.k;
        if(id[0] === 'm'){ // 多选切换
          let cur = ans[id] || [];
          cur = [...cur];
          const p = cur.indexOf(k);
          p >= 0 ? cur.splice(p,1) : cur.push(k);
          cur.length ? ans[id] = cur.sort() : delete ans[id];
        } else {
          ans[id] === k ? delete ans[id] : ans[id] = k;
        }
        const done = Object.keys(ans).length;
        q.querySelectorAll('.opt').forEach((x,xi)=>x.classList.toggle('on', ans[id]!==undefined && (id[0]==='m' ? (ans[id]||[]).includes(xi) : ans[id]===xi)));
        const pb =$('#pb'); if(pb) pb.style.width = (done/45*100)+'%';
        const fc =$('#fc'); if(fc) fc.textContent = done;
        const ct =$('.cnt'); if(ct) ct.textContent = done + '/45';
        save();
      });
    });
    q.querySelectorAll('.judge div').forEach(o=>{
      o.addEventListener('click', ()=>{
        const k = +o.dataset.k;
        ans[id] === k ? delete ans[id] : ans[id] = k;
        o.parentElement.querySelectorAll('div').forEach(x=>x.classList.remove('on'));
        if(ans[id] !== undefined) o.classList.add('on');
        const done = Object.keys(ans).length;
        const pb=$('#pb'); if(pb) pb.style.width=(done/45*100)+'%';
        const fc=$('#fc'); if(fc) fc.textContent=done;
        const ct=$('.cnt'); if(ct) ct.textContent=done+'/45';
        save();
      });
    });
  });
  window.scrollTo(0,0);
}

/* ---------- 评分 ---------- */
function myAns(type, i, q){
  const id = type + i;
  const a = ans[id];
  if(a === undefined || a === null) return null;
  if(type === 's') return [a];
  if(type === 'm') return a;
  return [a];
}
function judgeAll(){
  const res = {score:0, detail:[], sR:[0,0], mR:[0,0], jR:[0,0], wrong:[]};
  const secs = [['s', exam.single, 2, res.sR, '单选'], ['m', exam.multi, 3, res.mR, '多选'], ['j', exam.judge, 2, res.jR, '判断']];
  secs.forEach(([type, list, pt, counter, tname])=>{
    list.forEach((def, i)=>{
      const id = type + i;
      const correct = type === 'j' ? def[1] : def[2];
      const mine = ans[id];
      let ok = false, mineTxt, corrTxt;
      if(type === 'j'){
        ok = mine !== undefined && !!mine === correct;
        corrTxt = correct ? '正确 √' : '错误 ×';
        mineTxt = mine === undefined ? '未作答' : (mine ? '正确 √' : '错误 ×');
      } else if(type === 's'){
        ok = mine === correct;
        corrTxt = letter(correct) + '．' + def[1][correct];
        mineTxt = mine === undefined ? '未作答' : letter(mine) + '．' + def[1][mine];
      } else {
        ok = Array.isArray(mine) && mine.length === correct.length && mine.every((x,xi)=>x===correct[xi]);
        corrTxt = correct.map(x=>letter(x)).join('') + '．' + correct.map(x=>def[1][x]).join(' / ');
        mineTxt = Array.isArray(mine) && mine.length ? mine.map(x=>letter(x)).join('') : '未作答';
      }
      if(ok){ res.score += pt; counter[0]++; }
      counter[1]++;
      if(!ok) res.wrong.push({type, i, def, mineTxt, corrTxt, tname});
    });
  });
  return res;
}
function submit(){
  const done = Object.keys(ans).length;
  if(done < 45 && !confirm('还有 ' + (45-done) + ' 题未作答，确定交卷吗？')) return;
  submitted = true;
  tUsed = t0 ? Math.round((Date.now()-t0)/1000) : 0;
  save();
  renderResult(judgeAll(), true);
}
function renderResult(r, scroll){
  let reportCtx = {name:'',company:'',dept:'',phone:'',done:false};
  try{ const x = JSON.parse(localStorage.getItem(RKEY(exam.id)) || '{}'); if(x && x.done) reportCtx = x; }catch(e){}
  document.documentElement.style.setProperty('--tc', exam.theme[0]);
  document.documentElement.style.setProperty('--tc2', exam.theme[1]);
  const color = r.score>=90?'#00a06a':(r.score>=60?'#e67e00':'#E53935');
  const verdict = r.score>=90?'通关在望 · 火眼金睛':(r.score>=60?'历此诸关 · 尚需精进':'八十一难 · 再历一遭');
  $('#app').innerHTML = `
    <div class="bar" style="background:linear-gradient(135deg,${exam.theme[0]},${exam.theme[1]})">
      <div class="row1"><div class="name"><em>取经计划</em>${exam.name} · 成绩单</div></div>
    </div>
    <div class="score">
      <div class="num" style="color:${color}">${r.score}</div>
      <div class="of">满分 100 分</div>
      <div class="verdict" style="background:${color}">${verdict}</div>
      <div class="stats">
        <div><b>${r.sR[0]}/15</b>单选 · 得${r.sR[0]*2}分</div>
        <div><b>${r.mR[0]}/10</b>多选 · 得${r.mR[0]*3}分</div>
        <div><b>${r.jR[0]}/20</b>判断 · 得${r.jR[0]*2}分</div>
      </div>
      <div class="meta2">用时 ${fmtTime(tUsed||0)} · 成绩仅保存在本机</div>
      <div class="report">
        <div class="rt">成绩上报 · 交至老师总表<span>填写后提交，成绩实时出现在老师端的成绩单（含姓名/部门岗位/所在公司/手机号）</span></div>
        <div class="rrow"><input id="r-name" placeholder="姓名 *" maxlength="20" value="${reportCtx.name||''}"><input id="r-company" placeholder="所在公司（如：吉林电信）" maxlength="30" value="${reportCtx.company||''}"></div>
        <div class="rrow"><input id="r-dept" placeholder="部门 / 岗位" maxlength="30" value="${reportCtx.dept||''}"><input id="r-phone" type="tel" placeholder="手机号码 *" maxlength="11" value="${reportCtx.phone||''}"></div>
        <div class="rbtn">
          <button id="r-btn" onclick="report()">${reportCtx.done ? '已上报 · 修改后重报' : '上报成绩'}</button>
          <div class="rmsg" id="r-msg"></div>
        </div>
        ${reportCtx.done ? '<div class="rlink" onclick="reReport()">修改信息后重新上报</div>' : ''}
      </div>
      <div class="acts">
        <button class="btn p" onclick="retry()">再考一次</button>
        <a class="btn g" style="text-decoration:none;display:inline-flex;align-items:center" href="quiz.html">换一套卷</a>
      </div>
    </div>
    <div class="wrap2">
      ${r.wrong.length ? `<div class="wl-t">错题回顾 <span>共 ${r.wrong.length} 题未得分</span></div>
      <div class="wronglist">
        ${r.wrong.map(w=>`
          <div class="q wrong" style="border-color:#E53935">
            <div class="qt"><span class="n" style="color:#E53935">${w.i+1}</span>${w.def[0]}<span class="tag" style="background:#E53935">${w.tname}题</span></div>
            ${(()=>{ 
               if(w.type==='j'){
                 return `<div class="opts two">
                   <div class="opt ${w.def[1]?'on':''}" style="${w.def[1]?'border-color:#00a06a;--tc:#00a06a':''}"><span class="k"></span><span>正确 √</span></div>
                   <div class="opt ${!w.def[1]?'on':''}" style="${!w.def[1]?'border-color:#00a06a;--tc:#00a06a':''}"><span class="k"></span><span>错误 ×</span></div>
                 </div>`;
               }
               const correctArr = w.type==='s' ? [w.def[2]] : w.def[2];
               return '<div class="opts">'+w.def[1].map((o,oi)=>`
                 <div class="opt ${correctArr.includes(oi)?'on':''}" style="${correctArr.includes(oi)?'border-color:#00a06a;--tc:#00a06a':''}">
                   <span class="k">${letter(oi)}</span><span>${o}</span>
                 </div>`).join('')+'</div>';
             })()}
            <div class="fb">你的答案：<b class="bad">${w.mineTxt}</b> ｜ 正确答案：<b class="ok">${w.corrTxt}</b></div>
          </div>`).join('')}
      </div>` : '<div class="allright">满分通关 · 无错题，历此诸关俱各合格，加盖通关印！</div>'}
    </div>`;
  if(scroll) window.scrollTo(0,0);
}
function retry(){
  if(!confirm('清空本题答案，重新作答？')) return;
  ans = {}; submitted = false; t0 = Date.now(); tUsed = 0; save();
  renderQuiz();
}
function report(){
  const name = (document.getElementById('r-name').value||'').trim();
  const company = (document.getElementById('r-company').value||'').trim();
  const dept = (document.getElementById('r-dept').value||'').trim();
  const phone = (document.getElementById('r-phone').value||'').trim();
  const msg = document.getElementById('r-msg');
  const btn = document.getElementById('r-btn');
  msg.className = 'rmsg'; msg.textContent = '';
  if(!name || !phone){ msg.className='rmsg bad'; msg.textContent='姓名与手机号必填'; return; }
  if(!/^1\d{10}$/.test(phone)){ msg.className='rmsg bad'; msg.textContent='手机号应为11位'; return; }
  const r = judgeAll();
  btn.disabled = true; msg.textContent = '正在上报…';
  fetch(REPORT_URL, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({
    name, company, dept, phone, exam_id: exam.id, exam_name: exam.name,
    score: r.score, s_score: r.sR[0]*2, m_score: r.mR[0]*3, j_score: r.jR[0]*2, seconds: tUsed||0
  })}).then(x=>x.json()).then(j=>{
    if(j.ok){
      try{ localStorage.setItem(RKEY(exam.id), JSON.stringify({name, company, dept, phone, done:true})); }catch(e){}
      msg.className='rmsg ok'; msg.textContent='✓ 上报成功，成绩已交至老师总表';
      const li = document.querySelector('.report .rlink');
      if(!li) document.querySelector('.report').insertAdjacentHTML('beforeend','<div class="rlink" onclick="reReport()">修改信息后重新上报</div>');
    } else {
      msg.className='rmsg bad'; msg.textContent=(j.msg||'上报失败')+'，请重试'; btn.disabled=false;
    }
  }).catch(()=>{ msg.className='rmsg bad'; msg.textContent='网络异常，上报未成功（请稍后重试，或截图成绩告知老师）'; btn.disabled=false; });
}
function reReport(){ try{ localStorage.removeItem(RKEY(exam.id)); }catch(e){} renderResult(judgeAll(), false); }

/* ---------- 启动 ---------- */
if(!exam){ renderChoose(); }
else{
  load();
  if(!t0) { t0 = Date.now(); }
  if(submitted){ renderResult(judgeAll(), false); }
  else { save(); renderQuiz(); }
}
</script>
</body>
</html>
